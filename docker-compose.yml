services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports: ["5433:5432"]
    volumes: [orbit-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: orbit
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    # The script has to be ONE argument. A plain string here is word-split by
    # compose, so `sh -c` took "psql" as the whole script and every flag after
    # it — including -h postgres — became a positional parameter it ignored.
    # That is why this container failed every start with "connection to server
    # on socket ... failed": it was running a bare `psql`, against no host.
    #
    # Applying every migration in order, rather than naming them one by one,
    # is the same lesson scripts/dev.sh already learned.
    command:
      - |
        set -e
        # $$m, not $m: compose expands $VAR in this file before the shell ever
        # sees it, and $m is not set here — it would substitute an empty string
        # and psql would be handed no file at all.
        for m in /migrations/*.sql; do
          echo "applying $$m"
          psql -h postgres -U orbit -d orbit -v ON_ERROR_STOP=1 -f "$$m"
        done

  minio:
    image: minio/minio:latest
    container_name: orbit-minio
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: orbitadmin
      MINIO_ROOT_PASSWORD: orbitadmin123
    ports: ["9010:9000", "9011:9011"]
    volumes: [orbit-minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: orbitadmin
      MINIO_SECRET_KEY: orbitadmin123
      MINIO_USE_SSL: "false"
      BUCKET_PRIVATE: orbit-private
      BUCKET_PUBLIC: orbit-public
      JWT_SECRET: dev-only-change-me
      MAX_UPLOAD_MB: 25
      WEB_DIR: /app/web
    ports: ["8080:8080"]

  worker:
    build:
      context: .
      dockerfile: cv-worker/Dockerfile
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: orbitadmin
      MINIO_SECRET_KEY: orbitadmin123
      MINIO_USE_SSL: "false"
      BUCKET_PRIVATE: orbit-private
      BUCKET_PUBLIC: orbit-public
      API_BASE_URL: http://api:8080

volumes:
  orbit-pg:
  orbit-minio:
